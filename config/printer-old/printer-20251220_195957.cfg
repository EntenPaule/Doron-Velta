[idle_timeout]
timeout: 3600
gcode:
 TURN_OFF_HEATERS
 M84
 STOP_LED_EFFECTS

[gcode_arcs]
resolution: 0.1

[exclude_object]

[endstop_phase]

[homing_override]
gcode:
  LEDAM_REON
  STATUS_HOMING
  G28
  STATUS_ready
  G1 Z150 X0 Y0

[respond]
